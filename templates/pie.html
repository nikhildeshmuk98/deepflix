<html>
  <head>
    <meta name="csrf-token" content="{{ csrf_token() }}">

<script>
(function () {
    'use strict';

    const meta = document.querySelector('meta[name="csrf-token"]');
    if (!meta) {
        console.error('DeepFlix CSRF token meta tag is missing.');
        return;
    }

    const token = meta.content;

    function isUnsafe(method) {
        return !['GET', 'HEAD', 'OPTIONS', 'TRACE'].includes(
            String(method || 'GET').toUpperCase()
        );
    }

    function isSameOrigin(url) {
        try {
            return new URL(url, window.location.href).origin === window.location.origin;
        } catch (_) {
            return false;
        }
    }

    // Automatically protect fetch() requests.
    const originalFetch = window.fetch.bind(window);

    window.fetch = function (input, init) {
        init = init || {};

        const requestUrl = input instanceof Request ? input.url : input;
        const method = init.method || (
            input instanceof Request ? input.method : 'GET'
        );

        if (isUnsafe(method) && isSameOrigin(requestUrl)) {
            const headers = new Headers(
                init.headers || (input instanceof Request ? input.headers : {})
            );

            headers.set('X-CSRFToken', token);
            init = Object.assign({}, init, { headers: headers });
        }

        return originalFetch(input, init);
    };

    // Automatically protect XMLHttpRequest uploads.
    const originalOpen = XMLHttpRequest.prototype.open;
    const originalSend = XMLHttpRequest.prototype.send;

    XMLHttpRequest.prototype.open = function (method, url, ...args) {
        this.__deepflixMethod = method;
        this.__deepflixUrl = url;
        return originalOpen.call(this, method, url, ...args);
    };

    XMLHttpRequest.prototype.send = function (...args) {
        if (
            isUnsafe(this.__deepflixMethod) &&
            isSameOrigin(this.__deepflixUrl)
        ) {
            this.setRequestHeader('X-CSRFToken', token);
        }

        return originalSend.apply(this, args);
    };

    // Add token to dynamically created forms before submission.
    function addFormToken(form) {
        if (!(form instanceof HTMLFormElement)) return;

        if (!form.querySelector('input[name="csrf_token"]')) {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'csrf_token';
            input.value = token;
            form.appendChild(input);
        }
    }

    document.addEventListener('submit', function (event) {
        addFormToken(event.target);
    }, true);

    // Also cover forms submitted using form.submit().
    const originalSubmit = HTMLFormElement.prototype.submit;

    HTMLFormElement.prototype.submit = function () {
        addFormToken(this);
        return originalSubmit.call(this);
    };
})();
</script>

    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
      google.charts.load("current", {packages:["corechart"]});
      google.charts.setOnLoadCallback(drawChart);
      function drawChart() {
        var data = google.visualization.arrayToDataTable([
          ['Task', 'Hours per Day'],
          ['Work',     11],
          ['Eat',      2],
          ['Commute',  2],
          ['Watch TV', 2],
          ['Sleep',    7]
        ]);

        var options = {
          title: 'My Daily Activities',
          is3D: true,
        };

        var chart = new google.visualization.PieChart(document.getElementById('piechart_3d'));
        chart.draw(data, options);
      }
    </script>
  </head>
  <body>
    <div id="piechart_3d" style="width: 900px; height: 500px;"></div>
  </body>
</html>
